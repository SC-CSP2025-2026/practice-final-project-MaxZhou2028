<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Search Engine</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-dark text-white">
    <header class="container py-5">
      <div class="row mb-4 text-center">
        <div class="col">
          <h1 class="display-4 fw-bold">Movie Search</h1>
          <p class="lead">Find your favorite films</p>
        </div>
      </div>

      <div class="row mb-4 justify-content-center">
        <div class="col-md-8">
          <div class="input-group">
            <input
              type="text"
              id="movieInput"
              class="form-control form-control-lg"
              placeholder="Search for a movie (e.g., Avengers)..."
            />
            <button class="btn btn-primary btn-lg" type="button" id="searchBtn">
              Search
            </button>
          </div>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col">
          <div id="resultsList" class="row row-cols-1 row-cols-md-3 g-4"></div>
        </div>
      </div>
    </header>
    <script src="js/env.js"></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
